# Render blueprint — deploys the backend service.
# Docs: https://render.com/docs/blueprint-spec
#
# The frontend is a Next.js app and belongs on Vercel (see README → Deployment).
#
# Before the first deploy:
#   1. Create a MongoDB Atlas cluster and a Upstash Redis instance.
#   2. Fill in the sync:false secrets below in the Render dashboard
#      (Environment → Environment Variables) — they are never stored in git.
#   3. Run the schema push and seed once: pnpm db:push && pnpm db:seed

services:
  - type: web
    name: fdr-portal-api
    runtime: node
    plan: free
    region: singapore
    rootDir: backend
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm build
    startCommand: pnpm start
    healthCheckPath: /health
    autoDeploy: true

    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false # MongoDB Atlas connection string
      - key: REDIS_URL
        sync: false # Upstash rediss:// URL (optional)
      - key: JWT_SECRET
        generateValue: true
      - key: ENCRYPTION_KEY
        generateValue: true # 32-char hex
      - key: CORS_ORIGIN
        sync: false # e.g. https://fdr-portal.vercel.app,https://fdr-portal-you.vercel.app
      - key: FRONTEND_URL
        sync: false # e.g. https://fdr-portal.vercel.app
      - key: COOKIE_SAMESITE
        value: none # cross-site Vercel → Render
      - key: COOKIE_SECURE
        value: "true"
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: SMTP_HOST
        sync: false # production SMTP relay (SES, Postmark, Gmail)
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: LOG_LEVEL
        value: info
